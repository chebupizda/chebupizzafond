<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Фонд ЧЕБУPIZZA</title>
<style>
  :root { --red:#d90429; --dark:#8d0801; --white:#fff; --soft:#fff1f2; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { scroll-behavior:smooth; }
  body { font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:#2b0a0f; background:var(--white); line-height:1.5; min-height:100vh; display:flex; flex-direction:column; }
  header { background:var(--red); color:var(--white); padding:14px 16px; text-align:center; font-weight:800; letter-spacing:.5px; animation:slideDown .8s ease both; }
  .hero { position:relative; overflow:hidden; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; background:linear-gradient(160deg,var(--red),var(--dark),var(--red)); background-size:200% 200%; animation:bg 10s ease-in-out infinite; color:var(--white); text-align:center; padding:56px 20px; }
  .logo { position:relative; z-index:2; font-size:clamp(34px,9vw,64px); font-weight:900; letter-spacing:1px; animation:fadeUp 1s .2s ease both; }
  .logo span { background:var(--white); color:var(--red); padding:0 10px; border-radius:10px; margin-left:4px; display:inline-block; animation:float 3.5s ease-in-out infinite; }
  .slogan { position:relative; z-index:2; max-width:520px; margin:20px auto 32px; font-size:clamp(20px,5vw,28px); font-weight:700; font-style:italic; animation:fadeUp 1s .5s ease both; }
  .btn { position:relative; z-index:2; background:var(--white); color:var(--red); border:none; font-size:22px; font-weight:900; padding:16px 52px; border-radius:50px; cursor:pointer; box-shadow:0 8px 20px rgba(0,0,0,.25); transition:transform .25s ease, box-shadow .25s ease; animation:fadeUp 1s .8s ease both, pulse 2.4s 1.8s ease-in-out infinite; }
  .btn:hover { transform:translateY(-3px) scale(1.04); box-shadow:0 12px 26px rgba(0,0,0,.3); }
  .btn:active { transform:scale(.96); }
  .emoji { position:absolute; font-size:36px; opacity:.35; animation:drift linear infinite; z-index:1; }
  footer { background:var(--soft); border-top:3px solid var(--red); text-align:center; padding:18px 20px; font-size:13px; color:#6b1b24; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:20px; opacity:0; pointer-events:none; transition:opacity .35s ease; z-index:10; }
  .modal.open { opacity:1; pointer-events:auto; }
  .box { background:var(--white); border-radius:20px; padding:26px 22px; max-width:380px; width:100%; text-align:center; border-top:8px solid var(--red); transform:translateY(30px) scale(.92); transition:transform .45s cubic-bezier(.2,.9,.3,1.2); }
  .modal.open .box { transform:none; }
  .num { font-size:26px; font-weight:800; color:var(--red); letter-spacing:2px; margin:16px 0; font-variant-numeric:tabular-nums; }
  .num span { display:inline-block; opacity:0; transform:translateY(10px); }
  .modal.open .num span { animation:digit .5s ease forwards; }
  .note { font-size:12px; color:#6b1b24; margin-bottom:16px; }
  .small { background:var(--red); color:var(--white); border:none; padding:10px 22px; border-radius:30px; font-weight:700; cursor:pointer; margin:3px; transition:transform .2s; }
  .small:hover { transform:scale(1.06); }
  @keyframes fadeUp { from{opacity:0; transform:translateY(24px)} to{opacity:1; transform:none} }
  @keyframes slideDown { from{opacity:0; transform:translateY(-100%)} to{opacity:1; transform:none} }
  @keyframes float { 0%,100%{transform:translateY(0) rotate(-1deg)} 50%{transform:translateY(-6px) rotate(1deg)} }
  @keyframes pulse { 0%,100%{box-shadow:0 8px 20px rgba(0,0,0,.25), 0 0 0 0 rgba(255,255,255,.55)} 50%{box-shadow:0 8px 20px rgba(0,0,0,.25), 0 0 0 18px rgba(255,255,255,0)} }
  @keyframes bg { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
  @keyframes drift { from{transform:translateY(110vh) rotate(0)} to{transform:translateY(-20vh) rotate(360deg)} }
  @keyframes digit { to{opacity:1; transform:none} }
  @media (prefers-reduced-motion:reduce) { *{animation:none !important; transition:none !important} .num span{opacity:1; transform:none} }
</style>
</head>
<body>
<header>🍕 Шуточный проект 🥟</header>

<div class="hero" id="hero">
  <div class="logo">ЧЕБУ<span>PIZZA</span></div>
  <p class="slogan">Сделал дело — гуляш вкусный!</p>
  <button class="btn" id="help">ПОМОЧЬ</button>
</div>

<footer>Это вымышленный фонд, сайт сделан для шутки. Реквизиты не настоящие — деньги не переводите.</footer>

<div class="modal" id="modal">
  <div class="box">
    <h3>Спасибо, что хотели помочь!</h3>
    <div class="num" id="num"></div>
    <div class="note">Шуточные реквизиты вымышленного фонда. Не переводите деньги.</div>
    <button class="small" id="copy">Копировать</button>
    <button class="small" id="close">Закрыть</button>
  </div>
</div>

<script>
  const hero = document.getElementById('hero');
  ['🥟','🍕','🥟','🍕','🥟','🍕','🥟'].forEach((e,i) => {
    const s = document.createElement('span');
    s.className = 'emoji'; s.textContent = e;
    s.style.left = (8 + i*13) + '%';
    s.style.animationDuration = (9 + (i%4)*3) + 's';
    s.style.animationDelay = (-i*2.3) + 's';
    hero.appendChild(s);
  });

  const m = document.getElementById('modal');
  const num = document.getElementById('num');
  '2200 7012 4017 7003'.split('').forEach((c,i) => {
    const s = document.createElement('span');
    s.innerHTML = c === ' ' ? '&nbsp;' : c;
    s.style.animationDelay = (0.25 + i*0.04) + 's';
    num.appendChild(s);
  });
  document.getElementById('help').onclick = () => m.classList.add('open');
  document.getElementById('close').onclick = () => m.classList.remove('open');
  m.onclick = e => { if (e.target === m) m.classList.remove('open'); };
  document.getElementById('copy').onclick = () => {
    try { navigator.clipboard.writeText('2200701240177003'); } catch (e) {}
  };
</script>
</body>
</html>
